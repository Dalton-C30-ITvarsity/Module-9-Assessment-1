<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/custom.css">
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <a href="#" class="navbar-brand">Image Gallery Plus</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbar">
                    <div class="navbar-nav">
                        <a href="#" class="nav-item nav-link">Home</a>
                        <a href="#" class="nav-item nav-link">About</a>
                        <a href="#" class="nav-item nav-link">Contact</a>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <div id="carouselImg" class="carousel slide carouselImg" data-ride="carousel">
                <ol class="carousel-indicators">
                    <li data-bs-target="#carouselImg" data-bs-slide-to="0"></li>
                    <li data-bs-target="#carouselImg" data-bs-slide-to="1"></li>
                    <li data-bs-target="#carouselImg" data-bs-slide-to="2"></li>
                </ol>

                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/house.jpg" class="d-block w-100" alt="Image 1">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Beautiful House</h5>
                            <p>This is a beautiful house in the countryside.</p>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="img/leaves.jpg" class="d-block w-100" alt="Image 2">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Beautiful Leaves</h5>
                            <p>This is a beautiful forest with vibrant green leaves.</p>
                        </div>
                    </div>

                    <div class="carousel-item">         
                        <img src="img/tulips.jpg" class="d-block w-100" alt="Image 3">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Beautiful Tulips</h5>
                            <p>This is a beautiful field of tulips in bloom.</p>
                        </div>
                    </div>
            </div>
        </main>

        <script src="js/jquery-4.0.0.js"></script>
        <script src="js/bootstrap.bundle.js"></script>
    </body>
</html>
